# Opt in with: compose.sh --profile worker -f deploy/postiz/compose.workbench.yaml up -d
# Use an absolute path to this override if invoking compose.sh from elsewhere.
services:
  content-worker:
    command: [serve]
    environment:
      PORT: "8080"
      CONTENT_WORKBENCH_PASSWORD: ${CONTENT_WORKBENCH_PASSWORD:?Set a unique workbench password}
      CONTENT_WORKBENCH_URL: ${CONTENT_WORKBENCH_URL:-http://localhost:4080}
      POSTIZ_PUBLIC_URL: ${POSTIZ_PUBLIC_URL:-http://localhost:4007}
    ports:
      - "127.0.0.1:${CONTENT_WORKBENCH_PORT:-4080}:8080"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
